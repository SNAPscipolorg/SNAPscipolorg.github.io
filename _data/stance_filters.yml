# Master filter configuration for the Stance on Science search and per-state
# pages. Update this file to add new tags, races, or parties. All Stance pages
# read from this file. (Districts are free-form strings on each response and are
# not enumerated here.)

tags:
  - Agriculture
  - Artificial Intelligence
  - Climate
  - Energy
  - Environment
  - Investment in Higher Education
  - Jobs and Workforce
  - K-12 Science Education
  - Policymaking Process
  - Public Health
  - Science Diplomacy
  - Science Funding
  - Social Media
  - Transportation
  - Trust in Science

# alphabetical order for the Race picklists
races:
  - Attorney General
  - Governor
  - Lieutenant Governor
  - Local County Races [All]
  - Mayor
  - RTD Board of Directors  # for CO
  - Secretary of State
  - State Assembly
  - State Auditor
  - State Board of Education
  - State House of Representatives
  - State Legislature  # necesary for NE, the only state with a unicameral legislature
  - State Senate
  - State Supreme Court
  - State Treasurer
  - University Board of Regents
  - US House of Representatives
  - US Senate

# ballot order for grouping candidates in the "Group by candidate" view
# must contain exactly the entries in `races` above — the build fails if the two lists disagree
race_ballot_order:
  - US Senate
  - US House of Representatives
  - Governor
  - Lieutenant Governor
  - Attorney General
  - Secretary of State
  - State Treasurer
  - State Auditor
  - State Senate
  - State Supreme Court
  - State Assembly
  - State Legislature
  - State House of Representatives
  - State Board of Education
  - University Board of Regents
  - Mayor
  - Local County Races [All]
  - RTD Board of Directors

parties:
  - Democratic
  - Libertarian
  - Republican
  - Unity
  - No Party Preference
  - Independent
  - Unaffiliated
  - Green
  - Non-partisan
  - Party for Socialism and Liberation
  - No Labels Party
