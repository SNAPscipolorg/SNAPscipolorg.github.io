- id: ne-q1
  question: >-
    Scientific evidence is generated through the systematic testing and
    evaluation of ideas. It provides knowledge that helps us understand the
    world and predict the likely consequences of different choices, such as
    policy making related to public health, energy, agriculture, and
    environmental regulation. What role, if any, should scientific evidence
    and expert input play in your policymaking process, and how would you
    evaluate competing or uncertain scientific claims when making policy
    decisions? What role, if any, should that process play when scientific
    consensus and public opinion diverge?
  tag:
    - Policymaking Process
    - Trust in Science
  races:
    - US Senate
    - US House of Representatives

- id: ne-q2
  question: >-
    The United States has a growing artificial intelligence (AI) industry,
    supporting cutting edge innovation and reshaping businesses, but raising
    concerns about education, ownership, and security. Application of AI
    technology has increased the demand placed on data centers, controversial
    for their resource use (such as water and land) and raising utility costs.
    What are your policy positions in regards to data centers and AI? What are
    your reasons for supporting these policies?
  tag: Artificial Intelligence
  races:
    - US Senate
    - US House of Representatives

- id: ne-q3
  question: >-
    Making the US competitive in the bioeconomy (using technology applied to
    renewable biological resources to produce food, energy and industrial
    goods) requires innovation and investments in business, academia and
    government. Please describe policies you will support, if any, that relate
    to workforce development in Nebraska’s strengths such as agriculture,
    biotechnology, and energy; and explain their rationale.
  tag: Jobs and Workforce
  races:
    - US Senate
    - US House of Representatives

- id: ne-q4
  question: >-
    Federal grants from the National Institutes of Health (NIH) and National
    Science Foundation (NSF) fund a substantial share of the scientific and
    biomedical research conducted at Nebraska's universities, hospitals, and
    research institutions (approximately $205M per year according to NIH and
    NSF reports). NIH funding to NE institutions returns $2.50 for every $1
    economic activity while supporting vital research in developing new
    treatments/cures for diseases. Similarly, both NIH and NSF research fill
    critical gaps in knowledge for advancing healthcare and other fields. What
    policies, if any, do you support regarding federal funding for scientific
    research agencies like the NIH and NSF? Why are these your priorities, and
    what information informed your approach?
  tag: Science Funding
  races:
    - US Senate
    - US House of Representatives

- id: ne-q5
  question: >-
    Agricultural practices such as cover cropping and crop and livestock
    diversification, under appropriate conditions, provide benefits for soil
    health, water quality, and long-term agricultural resilience. At the same
    time, the feasibility and potential benefits of these practices can vary
    substantially. In what ways, if any, would you develop federal
    agricultural policy that accounts for the practical and economic needs of
    farmers and ranchers while also incorporating the best available
    scientific evidence on environmentally and agronomically beneficial
    practices?
  tag: Agriculture
  races:
    - US Senate
    - US House of Representatives

- id: ne-q6
  question: >-
    In your opinion, what is the role of the federal government in
    environmental protection? What policies, if any, do you support that could
    contribute to natural resource stewardship, environmental research, or
    environmental protections in Nebraska and nationally?
  tag: Environment
  races:
    - US Senate
    - US House of Representatives

- id: ne-q7
  question: >-
    In what ways, if any, will you consult with scientists and experts to
    prevent/ mitigate the risk and damage from natural disasters and in the
    response to natural disasters?
  tag: Environment
  races:
    - Governor

- id: ne-q8
  question: >-
    The governor represents Nebraska in formal dealings with other states
    (such as water management agreements affecting the Republican River Basin
    with Kansas and Colorado). What policies would you implement to keep water
    from the Ogallala Aquifer and rivers passing through the state clean, and
    how would you balance maintaining necessary water levels in Nebraska with
    sharing water resources with other states?
  tag:
    - Environment
    - Science Diplomacy
  races:
    - Governor

- id: ne-q9
  question: >-
    In your opinion, what is the purpose of the NE Department of Health and
    Human Services and what skill sets and values do you set as criteria when
    considering who to appoint to this state department?
  tag: Public Health
  races:
    - Governor

- id: ne-q10
  question: >-
    What steps, if any, would you take to ensure state agencies have access to
    reliable scientific expertise when implementing policies and that
    scientific evidence considered during policymaking is communicated clearly
    and transparently to the public?
  tag: Policymaking Process
  races:
    - Governor

- id: ne-q11
  question: >-
    Within the last year, the University of Nebraska Board of Regents
    eliminated four academic departments at University of Nebraska - Lincoln,
    including statistics and earth and atmospheric sciences. All four U
    Nebraska campuses are now facing additional budget reductions.
    Constituents and university leaders have raised concerns about how this
    will impact education and workforce readiness along with economic and
    social value from research (Wendling, 2025). NU President Gold stated: "We
    cannot cut our way to extraordinary, nor can we fully realize our mission
    of exceptional teaching, research and statewide engagement if we are
    operating in a constant cycle of cuts and related restrictions, without
    the ability to predict even a single year of stability" (Peal, 2026). In
    your opinion, what (if any) are the immediate and long-term effects of
    cuts to research and science education? Does state funding to the
    university system fit into your suggestions for balancing the state
    budget? And if so, what are your specific suggestions for doing this?
  tag:
    - Investment in Higher Education
    - Jobs and Workforce
  races:
    - Governor

- id: ne-q12
  question: >-
    In what ways, if any, would you incorporate scientific evidence when developing or evaluating public policy? How would you weigh scientific evidence alongside economic, ethical, and policy preferences when making decisions?
  tag: Policymaking Process
  races:
    - State Legislature

- id: ne-q13
  question: >-
    What is your vision for science and research in the state over the next decade? What programs within state departments will you prioritize funding that relate to the state’s science strengths?
  tag: 
    - Investment in Higher Education
    - Jobs and Workforce
    - Policymaking Process
    - Science Funding
    - Trust in Science
  races:
    - State Legislature

- id: ne-q14
  question: >-
    What opportunities, if any, do you see for partnerships between state government, universities, industry, and nonprofit organizations to strengthen scientific research?
  tag:
    - Investment in Higher Education
    - Jobs and Workforce
    - K-12 Science Education
    - Science Funding
  races:
    - State Legislature

- id: ne-q15
  question: >-
    Legislative appropriations for Nebraska's public universities have not kept pace with inflation, and state universities are now being asked to further reduce their budgets (Peal, 2026). What role should the Legislature play in providing funding for higher education? What policies, if any, would you support to balance the state budget while also supporting Nebraska's research capacity and student opportunities?
  tag:
    - Investment in Higher Education
  races:
    - State Legislature

- id: ne-q16
  question: >-
    What role do you believe science, research, innovation, and STEM workforce development should play in Nebraska's economy, state revenues, and accountable investments in the infrastructure and services that improve quality of life?
  tag:
    - Jobs and Workforce
  races:
    - State Legislature

- id: ne-q17
  question: >-
    Can you describe your approach to evaluating whether a policy is achieving its intended outcomes, and what evidence would prompt you to revise it?
  tag:
    - Policymaking Process
    - Trust in Science
  races:
    - State Legislature

- id: ne-q18
  question: >-
    State education standards are periodically updated to reflect advances in
    scientific knowledge. Would you, and if so how, ensure that decisions
    about science standards and curriculum are transparent and based on
    established evidence? What sources, if any, (ex. scientific experts,
    educators, community members, etc) would you consider when developing
    science education standards?
  tag:
    - K-12 Science Education
    - Trust in Science
  races:
    - State Board of Education

- id: ne-q19
  question: >-
    What opportunities, if any, do you see for partnerships between state
    government, universities, industry, and nonprofit organizations to
    strengthen scientific education?
  tag: K-12 Science Education
  races:
    - State Board of Education
    - University Board of Regents

- id: ne-q20
  question: >-
    What investments, if any, do you believe would have the greatest impact on
    improving science education across the state?
  tag: K-12 Science Education
  races:
    - State Board of Education

- id: ne-q21
  question: >-
    Please explain if and how you would support high-quality science
    instruction for students in both urban and rural schools, and explain why
    these are your policies?
  tag: K-12 Science Education
  races:
    - State Board of Education

- id: ne-q22
  question: >-
    Can you tell me about a time when you misunderstood something scientific,
    realized that you were wrong, and updated your understanding?
  tag: Trust in Science
  races:
    - State Board of Education

- id: ne-q23
  question: >-
    Both research universities and government-funded research programs play a
    critical role in advancing scientific discovery, training the future
    workforce, and driving economic development. How would you approach
    funding and oversight of research universities and government-funded
    research programs, and what outcomes would you hope to achieve through
    those investments?
  tag:
    - Investment in Higher Education
    - Policymaking Process
    - Science Funding
  races:
    - University Board of Regents

- id: ne-q24
  question: >-
    In order to avoid sweeping cuts and promote long-term financial stability,
    some academic departments at the University of Nebraska-Lincoln have been
    eliminated, which has raised concerns about the consequences to
    educational quality, workforce preparedness, and loss of life-saving data
    (Wendling, 2025). Are you concerned about the immediate and long-term
    effects of cuts to research and education- why or why not? How should
    university leaders evaluate budget reductions and what are your
    suggestions?
  tag:
    - Investment in Higher Education
    - Policymaking Process
    - Science Funding
  races:
    - University Board of Regents

- id: ne-q25
  question: >-
    The federal government is pursuing large-scale changes to student visa
    approval, including increased visa denials, revoking existing visas,
    restricting travel from certain countries, and decreasing student visa
    durations. How, if at all, should Nebraska respond to federal visa changes
    affecting international STEM students and researchers?
  tag:
    - Investment in Higher Education
    - Jobs and Workforce
    - Policymaking Process
  races:
    - University Board of Regents

- id: ne-q26
  question: >-
    What programs, if any, should the University of Nebraska school systems
    implement to attempt to reduce the financial burden of attending a college
    or graduate school for STEM-affiliated degrees in Nebraska?
  tag:
    - Investment in Higher Education
    - Jobs and Workforce
  races:
    - University Board of Regents

- id: ne-q27
  question: >-
    In what context would you seek scientific expertise and what type of
    experts from scientific disciplines you would source information from when
    providing legal counsel?
  tag: Trust in Science
  races:
    - Attorney General

- id: ne-q28
  question: >-
    Scientific evidence and our understanding of the world are always being
    updated as new studies are done and more information becomes available.
    What standards would your office use to determine whether information
    based on scientific research provides a sufficient basis for litigation,
    legal opinions, or enforcement actions?
  tag: Policymaking Process
  races:
    - Attorney General

- id: ne-q29
  question: >-
    Modern farms increasingly generate large amounts of operational data
    including global positioning system (GPS) and supply chain records. What
    role, if any, should the Attorney General play in protecting farmers' data
    privacy while encouraging innovation and research?
  tag: Agriculture
  races:
    - Attorney General

- id: ne-q30
  question: >-
    State Attorney Generals often join multi-state coalitions on matters
    affecting their residents, including cases involving environmental
    regulation, public health, and consumer protection. What approach, if any,
    would you take to deciding when Nebraska should participate in multi-state
    legal action on science/health related issues?
  tag: Policymaking Process
  races:
    - Attorney General

- id: ne-q31
  question: >-
    Some of the roles of Attorney General relate to environmental law,
    conservation, and protecting public health and safety including
    representation in litigation, general legal counsel and advice, the review
    of contracts, approval of rules and regulations, the drafting of legal
    opinions, and enforcement of agency administrative orders. What principles
    and priorities would guide your office’s approach to enforcing Nebraska’s
    environmental laws? How, if at all, would you incorporate scientific
    evidence and agency expertise into those decisions?
  tag: Environment
  races:
    - Attorney General
