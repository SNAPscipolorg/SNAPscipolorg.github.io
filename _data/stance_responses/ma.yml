    I support a balanced framework for AI regulation that protects the public while allowing responsible innovation to continue. We should regulate AI where the risks are highest: consumer privacy, discrimination, labor exploitation, election manipulation, fraud, surveillance abuse, and high-stakes uses in healthcare, housing, employment, education, and criminal justice.

    That means clear transparency standards, strong data privacy protections, disclosure requirements for AI-generated political or deceptive content, independent audits for high-risk systems, and legal accountability when companies deploy AI in ways that harm people. Workers and consumers should not be forced to bear the risk of systems they cannot inspect or challenge.

    At the same time, I do not believe regulation should punish open research, small innovators, or beneficial uses in medicine, education, accessibility, or scientific discovery. The line between necessary oversight and overregulation is whether a rule meaningfully protects the public interest or simply creates barriers without reducing harm.

    My view is simple: innovation should serve people, not outrun democratic accountability. We can support scientific and technological progress while making sure AI is transparent, fair, and governed by rules that protect civil rights and the public good.

