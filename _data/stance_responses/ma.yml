    As the only scientist in this race, I understand how far this administration has set back our research through its attacks on federally-funded universities and research programs. Congress must stabilize our scientific community and restore the investments torn away by this administration. One of my first priorities is to increase funding for the National Science Foundation, the Environmental Protection Agency, the National Oceanic and Atmospheric Administration, and other federally-supported research. Congress must undertake historic hiring and disbursement of research funds to offset the thousands of positions lost and hundreds of millions in grants canceled.

    Shortsighted cuts only increase costs for our nation. The ongoing outbreaks of Cyclospora and New World Screwworm are the direct result of cuts to biosecurity programs, now requiring massive resources to counteract. An ounce of prevention is truly worth a pound of cure.

    To train the next generation, Congress must restore student visas and pass legislation to restructure the federal student loan system. By eliminating interest on federal student loans for future and past borrowers, we allow our graduates to afford their degrees without trapping them into a lifetime of debt. I have experienced the lack of stability facing our scientists and researchers firsthand. The consequences of the existing cuts will last for generations if Congress does not act swiftly to restore the integrity of America's world-renowned research programs.

    For us to remain a leader in the sciences, we must have reliable, long-term investments in scientific research.

