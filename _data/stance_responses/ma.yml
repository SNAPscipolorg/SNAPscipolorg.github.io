    Affordability means more than insurance cards. It means lowering out-of-pocket costs, addressing medical debt, improving mental health and substance use treatment access, protecting reproductive healthcare, and ensuring care is available in rural, coastal, immigrant, disabled, and underserved communities. I also support public investment in overdose prevention and harm reduction strategies as part of a serious public health response.

