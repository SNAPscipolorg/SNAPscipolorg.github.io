    I support a national moratorium on data center development. Companies are overinvesting in these industries, creating a boom and bust economic bubble while selling out American workers and poisoning our environment. Congress must take swift action to halt development and to develop rigorous standards for any future data center construction.

    Minimum standards should include: - Data centers must provide their own, low/no-carbon power. Our communities cannot be subsidizing the energy costs of these facilities. Existing data centers should pay a high-usage surcharge, for utilities to invest in their own low- to no-emissions energy infrastructure projects. As tech companies look to utilize nuclear power, Congress must strengthen the U.S. Nuclear Regulatory Commission by increasing staffing and monitoring capabilities.

    - Prohibit the use of fossil fuels to power data centers and prioritize environmental justice for historically impacted communities.

    - Mandatory public reporting of energy and water usage for data centers to ensure transparency and accountability. This allows communities to adapt in real time to make necessary changes to their agreements with these facilities. Communities should control their own resources, not data centers. - Cap water usage, mandate the use of non-potable water, such as greywater, for cooling, and require all discharges be filtered and free of harmful compounds. - Prohibit Clean Air Act and Clean Water Act exemptions for emissions and discharges from data centers.

