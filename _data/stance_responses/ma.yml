    Technological advancement should improve society. Under our current system, revolutions in technology always lead to devastation for workers: automation is used to eliminate jobs and drive down wages because the technology is deployed to maximize profit rather than to benefit the people who make society run.

    Our proposed National Employment Emergency Act includes provisions specifically pertaining to AI and other advanced technology, to ensure it is properly regulated and deployed to benefit society. Our principle is simple: AI should be a public utility that is utilized to benefit the people and the planet, not billionaires.

    That means oversight should protect workers from being automated out of their livelihoods. Massachusetts workers, from hospital staff to educators to scientists, deserve a voice in if and how these systems are deployed in their workplaces. To the extent that AI can replace dangerous or menial jobs, workers should be provided with alternative employment prospects, not laid off and tossed aside. We must also take stock of the social (i.e. youth mental health) and environmental impacts of AI and implement a plan to mitigate its most harmful effects.

    The deepest innovations of the computer age — including the internet itself and the foundations of AI — came from publicly funded research. What actually slows socially useful innovation is a system where research priorities are set by tech billionaires who are motivated by lining their own pockets, not by what society needs. Public investment, public ownership, and public accountability can deliver both innovation and safety.

