    At the same time, public investment must come with accountability. I support transparent reporting on how funds are spent, strong conflict-of-interest rules, open scientific integrity standards, and protections against political interference in research. Oversight should focus on ethical conduct, public value, workforce development, and equitable access to opportunity, not on ideological censorship or micromanagement that discourages innovation.

    The outcomes I want are clear: better public health, stronger climate and energy solutions, expanded educational opportunity, and more high-quality jobs tied to research, manufacturing, and innovation. I also want federal research investments to reach communities beyond the usual hubs, including working-class and coastal communities in Massachusetts, so that science funding supports both discovery and shared prosperity.

