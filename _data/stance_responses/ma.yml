    Science should serve the public good, not line the pockets of greedy corporations. Today, corporations routinely patent the results of publicly funded research, and then sell the products back to working families at exorbitant prices. Insulin is one of the most egregious examples: in 1923, its discoverers sold the patent for a dollar so it could be affordably mass-produced to benefit humanity. Instead, pharmaceutical companies price gouge it, and over a million Americans ration their insulin.

    I support dramatically expanding public investment in scientific research, and I support keeping the fruits of that research in public hands. Our platform calls for mass-producing generic versions of pharmaceuticals and medical devices currently locked behind corporate patents, so that publicly funded discoveries actually reach the public.

    Investment in research also means investment in the people who do it. Our platform calls for a publicly funded guarantee to free education from pre-K through PhD in all fields. Early-career scientists in Massachusetts shouldn't have to choose between their research and paying rent, and they shouldn't be one canceled grant away from leaving science altogether.

    The outcomes I'd fight for: a research enterprise insulated from political attacks and corporate control, a scientific workforce that working-class young people — including Black, immigrant, and rural students — can actually join, and discoveries that translate into public benefit rather than billionaire profits. Massachusetts is home to some of the world's great research institutions. The wealth and knowledge they generate should belong to society as a whole.

