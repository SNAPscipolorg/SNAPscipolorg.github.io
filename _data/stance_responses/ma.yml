    Massachusetts must manage land-based resources with long-term stewardship, climate resilience, and public access in mind. I support policies that protect drinking water, wetlands, open space, farmland, forests, and coastal ecosystems while ensuring these resources are not sacrificed to short-term private gain.

    That includes stronger conservation funding, protection of parks and preserves, climate-resilient land use planning, and support for local and regional efforts to restore wetlands, shorelines, and other natural systems that reduce flooding and protect biodiversity. I also support stronger environmental justice standards so that low-income communities and communities of color are not disproportionately burdened by pollution, poor water quality, or lack of access to green space.

    Water policy should prioritize public health, watershed protection, and infrastructure investment so communities can rely on safe, affordable water in the face of climate stress. Land use policy should also discourage destructive speculation and support sustainable development patterns that preserve natural resources while addressing housing and transportation needs responsibly.

    In practice, that means treating land and water as public goods. We need policies that preserve Massachusetts' natural resources for future generations while making sure all residents, not just the wealthy, can benefit from healthy ecosystems, clean water, and accessible public spaces.

