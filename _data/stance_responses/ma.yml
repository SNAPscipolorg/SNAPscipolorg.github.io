    Artificial intelligence has alot potential to improve things like healthcare, education, public safety, and government services, and I support responsible innovation. However, innovation shouldn’t come at the expense of our communities, our environment, or working families.
    I support reasonable safeguards that require transparency when AI is used in decisions affecting employment, healthcare, lending, or public services. People deserve to know when AI is making decisions that impact their lives and should always have the right to meaningful human review. Coming from a social services background , in particular, where there are limited HIPAA protections in AI, we must protect people’s privacy.
    I'm also concerned about the rapid expansion of AI data centers. These facilities consume huge amounts of electricity and water, placing added strain on our power grid, natural resources, and climate goals. My district is already under some serious strain from drought. I would support Massachusetts requiring environmental impact reviews, responsible siting, and investments in energy efficiency before approving large-scale AI infrastructure.
    Finally, we have to protect workers as AI becomes more common. Technology should enhance jobs, not simply replace them. I support workforce retraining, upskilling programs, and policies that encourage employers to invest in their employees as they adopt AI.
    The goal should be thoughtful oversight that protects people, promotes responsible innovation, and ensures AI benefits everyone, not just the companies developing it.

