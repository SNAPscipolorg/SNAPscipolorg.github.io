    Healthcare is a human right, and our platform treats it that way: free, quality healthcare for all, with no premiums, no deductibles, no copays.

    Our National Health Emergency Act proposes establishing a single-payer People's Health Service by converting the top health insurers to public ownership, and takes the top pharmaceutical manufacturers and distributors into public hands to mass-produce affordable generic medications and medical devices. It abolishes medical debt — which drives hundreds of thousands of American families into bankruptcy every year.

    Access is about more than coverage. Massachusetts has some of the world's most prestigious hospitals and some of the country's highest premiums — and health deserts where Black and immigrant neighborhoods and rural communities lack primary care, specialists, and mental health professionals. Our platform calls for 1,000 new public hospitals and 5,000 clinics by 2035, prioritizing health deserts, and empowers communities to set local priorities like the opioid crisis and Black maternal health.

    To staff this system, we would make medical and nursing school free, with campus housing and stipends, paired with a five-year service commitment in underserved areas.

    We have the means to pay for this: we already spend more on healthcare than any other country, yet have worse outcomes than nations that cover everyone for less. The barrier isn't cost — it's the insurance, pharmaceutical, and healthcare corporations.

    Scientists know better than anyone: we have the medical knowledge to keep people healthy. We lack a system organized to deliver it. That's what I'm running to change.
