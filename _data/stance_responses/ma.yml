    Land, water, and open space are public goods, and they should be managed as such — for people and the planet, not for polluters' profits.

    Our proposed National Environment Emergency Act makes the cleanup of contaminated water and soil a national priority, along with replacing aging and toxic infrastructure — including lead pipes and methane gas lines, both serious problems in Massachusetts' older housing stock and cities. It calls for immediately shutting down contaminating facilities in the communities most affected by polluters, and banning construction of new landfills, refineries, and other polluting facilities in those same communities. In Massachusetts, environmental burdens fall hardest on Black, immigrant, and working-class neighborhoods and on rural towns — environmental justice has to be at the center of resource management, not an afterthought.

    More broadly, our platform treats the climate crisis as the emergency it is: seizing the billionaires' fossil fuel infrastructure, building a publicly owned renewable energy grid, and mobilizing a Climate Corps of workers — with union representation and job training — similar to the Civilian Conservation Corps, which built much of the public land infrastructure we still enjoy today. That same mobilization of people power is how we protect and expand parks and open space: with dedicated public investment and a workforce employed to steward it.

    When land and water are managed for profit, they degrade. When communities have real power over them, through public ownership and democratic planning, they get protected.

