      I support science-based investments in water conservation, healthy soils, drought preparedness, precision agriculture, and producer support programs. In Broomfield, we’ve had a strong working relationship with trusted partners such as CSU Extension and I would work on building stronger partnerships with conservation districts, and the Colorado Department of Agriculture. We can help farmers and ranchers adapt to changing conditions while remaining productive and competitive. Because agriculture, water management, and climate resilience are closely linked, I support continued implementation of strategies that advance both agricultural sustainability and the objectives of the Colorado Water Plan. 
      As Colorado faces these challenges, it is essential that we continue to rely on practical, evidence-based solutions that strengthen our communities, support working families, and help local businesses succeed.
      I believe we must ensure that family farmers and ranchers can remain viable in the face of rising production costs, increasing water demands, and changing environmental conditions. That means investing in efficient irrigation technologies, supporting innovative soil health practices, strengthening local and regional food systems, and expanding access to fresh, healthy food in underserved communities. It also means protecting rural economies from harmful practices that permanently transfer agricultural water rights away from farming communities.
      Colorado's farmers and ranchers are already doing their part. They should not have to shoulder the burdens of water scarcity and climate resilience on their own. The state must be a committed partner, working alongside producers to advance practical, science-informed solutions that sustain both our agricultural heritage and our future prosperity."

- candidate_first_name: Heidi
