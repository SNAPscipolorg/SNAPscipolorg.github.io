      “A highly competent science and technology advisory board will be a key part of my administration. They will need to know about the best science validating the most affordable and effective solutions that can be employed by state government. The board will include social and political scientists to advise on raising Colorado to be a free and sovereign country with a strong scientific orientation.
      
      One of my objectives would be to review the scientific basis of previous state policies. That would help to determine if it was authentic science, or corporate propaganda disguised as science to advance a profit-motivated agenda. As the former Vice President of Special Projects at the DaVinci Institute in Colorado, I’m committed to supporting real science and technology in government to benefit the People in the best way possible.
      
      On day one, I would establish a P.A.C.T. – Partnership for Applied Coherence Technologies. The PACT would advance scientific and technological breakthroughs in areas such as graphene and coherent electromagnetic fields. Both of these offer benefits to virtually every area of government responsibility and the private sector. However, they are being mostly ignored by technology incubators and the current administration in Colorado. That has, for example, put Colorado in only 19th place among all U.S. states for research and commercialization of graphene. The irony is that Colorado is home to probably the best technology in the world for producing graphene at scale with the widest spectrum of high-quality carbon nano-products.
      
      It's often said that persistent societal problems are due to politics, and not a lack of affordable and proven solutions. I will take politics out of the equation for policies. Many highly affordable, evidence-based scientific and technological solutions are already described in my SOLUTIONS BLUEPRINT. [see jeffpeckman.com/solutions-blueprint]
      
      In 1999, I proposed a statewide ballot initiative to improve the state budget. It stated: “The citizens of Colorado, therefore, hereby declare that in any state budget request, including emergency spending measures, priority in appropriations shall be given to the most efficacious and cost-effective programs, according to peer-reviewed scientific studies, that may best achieve the goal of the requesting department, agency or institution.” “Peer-reviewed” studies are probably not practical in every budget item. However, as governor, I would encourage this mindset in both the public and private sectors. That’s not just for budgeting, but for economic development and elevating the quality of life for Coloradans.


