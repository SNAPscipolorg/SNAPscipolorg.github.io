  response: |
      "Colorado farmers understand better than anyone that you cannot argue with the land. If there is less water, higher fertilizer costs, changing weather patterns or declining soil health, farmers have to understand what is happening and find better ways to adapt.
      
      Science and government-supported research can be extraordinarily valuable. We only need to look back at the Dust Bowl to recognize that understanding what is scientifically happening to the land can help us combat an immediate crisis, and prevent the next one.
      
      I would support research that asks practical questions: How can we grow more with less water? Can we develop crops better suited to Colorado's climate? Can precision agriculture reduce fertilizer, water and pesticide use while maintaining yields? What can new technologies teach us? And what haven't we thought of yet?
      
      I believe in limited government, but that doesn't mean limiting government's role in bridging the divide between scientific discovery and the farmers who can benefit from it, whether that knowledge originates here or internationally. Government can collect reliable data, support experimentation and make that knowledge accessible without burying farmers in bureaucracy.
      
      And farmers must have a seat at the table. Scientific evidence matters, but so does the knowledge of people who actually work the land. These are the people producing America's food. Their voice is necessary.
      
      Agriculture isn't simply an industry America inherited. It helped grow our nation, and it is something Americans are proud of. We should always be asking how we can make it better, and give farmers, scientists and innovators the freedom and resources to find out."

- candidate_first_name: Patty
