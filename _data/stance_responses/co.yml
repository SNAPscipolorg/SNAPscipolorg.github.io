      "I'm genuinely concerned about the state of science literacy in America — not because students are incapable, but because the world they're entering is becoming dramatically more complex. From AI and cybersecurity to climate, public health, and advanced manufacturing, today's students need the ability to evaluate evidence, understand uncertainty, and think critically about rapidly changing systems.
      Too often, science education has been treated as a collection of facts to memorize instead of a way of thinking to develop. When students learn science as a process of curiosity, experimentation, and problem-solving, they gain skills that extend far beyond the classroom.
      This issue is personal for me. My own children attend public schools here in Colorado, so I have a direct stake in the quality of education our students receive. My sister was also a teacher who ultimately had to leave the profession because the cost of childcare exceeded her salary — and that story is not unique. Colorado has struggled to recruit and retain teachers for years, and in some cases has lowered standards because the shortage has become so severe. If we want stronger science literacy, we need skilled, engaging educators in K-12 classrooms, and that means treating teaching like the essential profession it is.

      In Congress, I will:
      -Strengthen K-12 standards around scientific reasoning, inquiry-based learning, and media literacy beginning at an early age — students should learn to evaluate sources, interpret data, and distinguish credible evidence from misinformation long before they're making major civic, healthcare, or financial decisions as adults
      -Connect science education to the real world students live in — in Colorado, that means agriculture, water systems, aerospace, energy, public lands, and environmental stewardship; when students see how science impacts their communities and future careers, it becomes relevant rather than abstract
      -Support the teacher pipeline with competitive pay, professional development, and freedom from political interference in curriculum — states that have undermined science standards have done a disservice to their students, and I will oppose any federal effort to follow that path
      -Invest in lifelong science literacy through museums, libraries, community partnerships, and public science programming that reaches adults and families, not just students in classrooms

      Colorado already has incredible assets to build on — world-class research institutions, national laboratories, aerospace innovation, and a strong culture of outdoor stewardship. My goal is to ensure federal education and research policy strengthens those connections and prepares the next generation not just to understand science, but to help shape the future responsibly."

