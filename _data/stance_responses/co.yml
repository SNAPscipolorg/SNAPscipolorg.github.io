  response: |
      "I think we have a larger problem than K-12 science literacy. Adult Americans need to become excited about learning again.
      
      Education is a community problem. Children grow up surrounded by adults, and if learning ends when adults leave school, we shouldn't be surprised when children begin to see education as something they endure until graduation rather than something they pursue throughout their lives.
      
      That is one reason I developed O.P.E.N. America, my proposal for lifelong, credentialed higher education. Americans already invest in education through their tax dollars. I want to create a system where people can continue turning that investment into knowledge, skills and credentials throughout their lives. Imagine children growing up in homes where their parents and grandparents are taking classes, exploring new subjects, learning new technologies and talking about what they discovered.
      
      Science is particularly suited to rebuilding that excitement because science begins with curiosity: Why? How? What if? The children would grow up watching their parents explore STEM and this would lead to conversations and curiosity. This is where minds open to endless possibilities.
      
      K-12 science should teach scientific principles and the scientific method, but students should also experiment, build, question, fail and try again. And if they know those opportunities to learn will never end,  they will be more likely to continue to explore.
      
      AI makes this even more important. AI is not a substitute for education. It is an extraordinary enhancement to education but information is not understanding. We still need the knowledge and critical-thinking skills to ask good questions, challenge answers and recognize when something doesn't make sense.
      
      I want children excited about learning. But I also want them growing up in communities where the adults are excited about learning too."

