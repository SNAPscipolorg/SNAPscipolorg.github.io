      More broadly, I would invest in disease surveillance, early detection, maternal and child preventive care, access to primary care, and public-health research. Prevention saves lives and, in many cases, saves healthcare dollars as well.
      
      As a physician, I will always follow the evidence, even when the evidence is politically inconvenient."

