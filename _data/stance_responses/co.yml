      "I believe one of our greatest public-health challenges is rebuilding trust.
      
      I spent 35 years with the U.S. EEOC and served as a Public Information Officer. I learned something very important in that role: if the public doesn't trust your agency, you don't get to blame the public. That's on you. Government has to earn trust through honesty, transparency, competence and communication.
      
      That matters enormously in public health.
      
      Recently, I wondered whether I needed another measles vaccination. Rather than guessing, I was tested for immunity. I learned that I was still immune and didn't need another vaccination. That's evidence-based preventive health: give people reliable information, access to appropriate testing and medical care, and the ability to make informed decisions with their healthcare providers.
      
      Government also has an important role in identifying threats early. I support strong disease surveillance, including innovative tools such as wastewater monitoring, timely reporting to healthcare providers, accessible testing, and rapid public communication when an infectious disease is detected.
      
      But communication cannot simply mean telling people what to do. Public-health agencies should explain what we know, what we don't know, what the evidence shows, and why recommendations are being made. When evidence changes, say so. When government gets something wrong, say so.
      
      Vaccines, surveillance and medical technology are important tools. But none of them works as well as it should if people don't trust the institutions providing the information.
      
      Good public health requires good science. Good public health also requires public trust. We have to earn both."

- candidate_first_name: Patty
  candidate_last_name: McMahon
