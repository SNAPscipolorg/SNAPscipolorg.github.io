  primary_candidate: true
  response: |
      "As a science teacher and tutor for more than 15 years, I have spent my career helping students learn not just scientific facts, but engage with our world in outdoor classrooms and Project Based Learning, like Northglenn High School’s programming. I’ve taught students how fossil fuel extraction exacerbates climate change and how policy meets the scientific road in regard to health and safety, as well as vaccine access.  I've also engaged in community outreach as part of the Adams 12 ELEVATE program, with insight from thousands of community members, for our strategic plan, which serves as the roadmap for success in the Five Star District. This work expanded the impact our schools can have and why investing in schools is important.
      So, in today's world, science literacy is more important than ever. Whether people are evaluating health information, understanding emerging technologies like artificial intelligence, making decisions about energy and natural resources, or navigating misinformation online, the ability to assess evidence and think critically is an essential civic skill.
      I support strengthening K-12 science education by continuing to emphasize inquiry-based learning, hands-on investigations, problem-solving, and real-world applications. Students should have opportunities to engage with authentic scientific questions, analyze data, and learn how evidence is gathered and evaluated. We should also better integrate media literacy, data literacy, and critical thinking skills into science instruction so students can navigate the vast amount of information they encounter every day.
      Colorado has world-class scientific resources, from our universities and research institutions to our aerospace, biotechnology, clean energy, and agricultural sectors. However, we need to be sure we have the funding for our public schools to build a strong teaching workforce and the support they need. Additionally, building stronger partnerships between schools, scientists, industry professionals, and community organizations can help students see science as relevant, accessible, and connected to careers and everyday life.
      As an educator, I have seen that students become most engaged when they can connect science to their own experiences and communities. Effective science education should help students understand not only the scientific concepts behind important issues, but also how scientific knowledge is developed, communicated, and applied to solve real-world problems.
      Ultimately, science literacy is not about training every student to become a scientist. It is about preparing all students to be informed citizens who can evaluate evidence, make sound decisions, and participate thoughtfully in our democracy. That goal has guided my work in the classroom, and it would continue to guide my work as a legislator."

