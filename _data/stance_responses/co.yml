      Advisory groups should include practitioners with firsthand experience, not solely academics, agency officials or advocacy organizations. A transportation engineer, rural physician, farmer, small-business owner or county commissioner may identify practical consequences that a statewide model overlooks. Minority viewpoints and credible conflicting evidence should also be considered rather than excluded
      
