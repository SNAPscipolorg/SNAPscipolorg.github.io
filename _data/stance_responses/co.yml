      "Colorado should welcome responsible investment in artificial intelligence and data infrastructure, but growth must not force families, farmers and existing businesses to subsidize the industry’s substantial electricity, water and infrastructure demands.
      
      Data centers can bring construction investment, tax revenue and high-skilled employment. They can also require enormous amounts of power, create new transmission costs, consume water and affect neighboring communities through noise, traffic and land-use changes. The proper balance is growth that pays its own way and respects local priorities.
      
      I support transparent utility proceedings requiring data-center developers to bear the costs of the generation, transmission and grid upgrades needed to serve them. Long-term contracts, appropriate financial sureties and protective rate structures should prevent existing customers from being left with stranded costs if a project closes or uses less power than projected.
      
      Developers must disclose anticipated energy and water demands before approval. Colorado should encourage, but not prescribe, a diverse supply of reliable power, including natural gas, advanced nuclear, renewables and storage. Projects using reclaimed water, closed-loop systems, air cooling, waste-heat recovery or other resource-saving technologies may merit incentives when benefits can be independently verified.
      
      County and municipal governments must retain meaningful land-use authority. Local residents deserve early notice and a voice regarding water availability, noise, emergency services, roads and community impacts.  Local governments are best positioned to ensure objective impacts to their communities are fully mitigated.
      
      Colorado does not need either a blanket prohibition or a taxpayer-funded giveaway. We need clear rules, accurate information, local control and enforceable protections ensuring that innovation benefits Colorado without shifting its costs onto everyone else."

