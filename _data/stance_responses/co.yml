      "First off, we need to ban for-profit water speculation.  Right now, there is a trend toward large financial interests buying up land with water shares with the hopes of leveraging those shares as our man-made crises unfold.  We need to promote drought resilience research, training, and conservation methods, and we need to take a larger scale look at how human activity is affecting our water sources to begin with.  We already passed the 1.5C threshold - the first 12 month period was from February 2023 to January 2024, and 2024 was the first calendar year that remained above.  The rate at which we alter the chemistry of the atmosphere is still increasing, and that's just one of our problems."

