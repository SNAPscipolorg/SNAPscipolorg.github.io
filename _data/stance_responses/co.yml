  response: |
      "I am excited about the possibilities of AI and believe America should remain a leader in its development. My district already has data centers in Aurora that have operated for years without becoming a major community issue. That tells me data centers and communities can coexist. It does not tell me that every proposed data center should automatically be approved.
      
      I become concerned when large projects are pushed through too quickly or too quietly, particularly when they require significant amounts of resources that communities themselves are being asked to conserve.
      
      Water is the obvious example in Colorado. If residents, farmers and businesses are being told that water is scarce, they deserve to know how much a proposed data center will use, where that water will come from, what effect it will have on existing users, and what conservation or recycling technologies could reduce that demand. The same scrutiny should apply to electricity, infrastructure and other significant community impacts.
      
      I don't believe government should decide that AI is either inherently good or inherently bad and make policy from there. Decisions should be based on evidence, transparent resource-use projections, meaningful public input and the circumstances of the community involved.
      
      Innovation and responsible stewardship are not opposing goals. I want Colorado to welcome the people asking, “What can AI make possible?” But the people who live in the communities making that innovation possible deserve a meaningful voice in answering, “At what cost?”"

- candidate_first_name: Patty
