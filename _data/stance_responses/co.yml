      I would support maintaining strong, evidence-based vaccination recommendations, expanding access to vaccines through programs such as Vaccines for Children, and investing in public-health infrastructure so communities can rapidly identify and contain outbreaks. I would also support accurate, transparent public-health communication that gives families the evidence they need to make informed decisions with their healthcare providers.
      
