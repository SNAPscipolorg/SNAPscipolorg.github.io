  response: |
      "As a Technical Service Veterinarian for a major animal pharmaceutical company, my job was to work with producers to contain disease outbreaks in large herds, experience that directly informs how I think about outbreaks like the measles cases we've seen in Colorado since 2025. I would strengthen school vaccine requirements based on the safety and efficacy of individual vaccines, the risk of disease spread to the broader community, and the risk to our most vulnerable residents. Religious exemptions should be preserved; however, non-medical, non-religious exemptions should be revisited, with a higher bar for granting them. Raising our herd immunity protects not just the vaccinated, but those around us who cannot be vaccinated or are immunocompromised.
      In addition, as a veterinarian, I subscribe to the "One Health" philosophy: that animal and human health are inherently linked. Pandemics often begin as a minor illness in one species and jump to another as a life-threatening illness in a new host. The state needs to strengthen its surveillance of zoonotic diseases so we can catch these threats before they spread widely."

- candidate_first_name: Dr. Maureen 'Mo'
  candidate_last_name: Dower
  state: co
