  response: |
      "Effective public health policy should be grounded in sound scientific evidence, accurate information, access to healthcare, and informed choice. Colorado should use the best available evidence to prevent and respond to infectious diseases such as measles while respecting individual rights whenever possible.
      
      I support strong access to primary care, preventive services, timely diagnosis, treatment, and reliable public-health information. This is particularly important in rural Colorado, where families may travel significant distances for healthcare and hospitals and clinics often operate with limited resources.
      
      During an infectious-disease outbreak, state and local officials should clearly communicate the demonstrated risks, available prevention and treatment options, and the scientific evidence supporting their recommendations. They should also be transparent about uncertainty and willing to revise recommendations when credible new evidence emerges.
      
      I believe healthcare decisions should include informed choice and meaningful discussion between patients, families, and qualified healthcare providers. Public-health interventions should be proportionate to the demonstrated risk, and broad mandates should not become a substitute for education, transparency, access, and public trust.
      
      Science should guide public-health policy, not political or social agendas. Political pressure should never be used to override credible scientific findings or suppress legitimate scientific discussion.
      
      Finally, strengthening rural healthcare capacity is itself a preventive-health strategy. Communities are healthier and more resilient when people can obtain timely care from accessible providers they know and trust."

