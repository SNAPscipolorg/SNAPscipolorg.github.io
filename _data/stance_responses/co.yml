      "The measles outbreak Colorado has experienced since 2025 is a stark reminder that public health infrastructure and trust in science cannot be taken for granted. The consequences of preventable disease outbreaks fall on real families, real children, and entire communities — and we should treat that with the seriousness it deserves.
      I support vaccines. The scientific evidence on safety and effectiveness is overwhelming, and I will not equivocate on that in Congress or anywhere else.
      My commitment to this is personal and practical. As president-elect of my local Rotary club, we partnered with El Paso County Public Health to support vaccination and education efforts for children and families in our community — and Rotary has been a global leader in vaccination campaigns and the fight to eradicate polio. In my professional work, I supported a client involved in the Zika vaccine response effort, which reinforced how critical coordinated public health planning, scientific research, and community education are during infectious disease outbreaks.

      In Congress, I will:
      -Strengthen funding for disease surveillance, outbreak response, and community health education — especially in rural and underserved parts of CD-5 that often lack robust healthcare infrastructure
      -Expand access to preventive care through community health centers and school-based programs so vaccinations, screenings, and routine care are accessible regardless of income, geography, or insurance status
      -Combat health misinformation seriously — through investment in public health literacy, support for trusted local messengers, and accountability for platforms whose algorithms amplify demonstrably false information that puts lives at risk

      Rebuilding public trust also requires transparency, consistent communication, and leaders willing to stand behind the science even when it's politically inconvenient. That's the standard I'll hold myself to in Congress."

