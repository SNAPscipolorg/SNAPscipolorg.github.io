  response: |
      "Colorado should welcome innovation, artificial intelligence, and the economic opportunities they can create, while ensuring that new data centers do not shift their costs and resource demands onto existing residents, businesses, or taxpayers.
      
      I would support a transparent, evidence-based review of major data-center projects before governments provide subsidies, tax incentives, infrastructure commitments, or special treatment. We should understand a project’s expected electricity and water use, impacts on local infrastructure and utilities, additional generation or transmission needs, and who will ultimately pay for those improvements.
      
      Water is particularly important in Colorado. Data centers should not compete with agricultural, domestic, or other essential water needs without a clear understanding of the consequences. Projects should demonstrate that their resource demands can be responsibly accommodated.
      
      The electrical grid must also have the capacity to support an AI or data-center project. If additional generation or transmission capacity is necessary, the project should be economically responsible for the associated expansion costs rather than shifting them to the public.
      
      Economic benefits should be evaluated realistically, including permanent jobs, tax revenue, infrastructure requirements, and broader impacts on local economies. Government should not socialize costs while private interests receive the benefits.
      
      I also support strong protections for individual privacy and personal information as AI and data technologies evolve. Those protections should be clear and enforceable without unnecessarily restricting beneficial innovation.
      
      The right balance is not to oppose new technology, but to require accountability. Colorado can encourage investment and innovation while protecting water, energy reliability, taxpayers, property rights, privacy, and existing communities."

- candidate_first_name: Naomi
