  response: |
      "Many residents in our state are not scientifically literate. It creates a mismatch between what the data shows to be the best policy in a given area and what the public is willing to accept. This is evident in the debate over data center development, where questions about water use, energy demand, and environmental impact require a level of scientific literacy that most residents, and even many lawmakers, don't have, making it harder to have an informed public conversation about the right path forward. Closing that gap starts in K-12 education. I believe schools should shift away from lecture-based, textbook-driven instruction and toward more hands-on learning, giving students the chance to connect scientific concepts, including how energy, water systems, and natural resources actually work, to the natural world around them. When students can see, feel, hear, and meaningfully discuss science, rather than just memorize it, they grow into more discerning consumers of information as adults."
