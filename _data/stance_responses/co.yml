      "Unfortunately, we're slipping our way backwards into a new dark age even as we're on the cutting edge of scientific understanding.  Ignorance and dogma are so powerful right now that it boggles my mind.  We're at a strange juncture, though, in that our new emphasis on STEM programs, while a step in the right direction, needs to be accompanied with a stronger dose of philosophy to help people learn to think at all.  Our education system has become a corporate vocational sorting pipeline, and so those with more humble vocational aspirations tend to tune out learning in general.  We don't want a generation of people who will create for cash without being able to ask whether they should or not."

- candidate_first_name: Patty
  candidate_last_name: McMahon
  state: co
  race: US House of Representatives
  district: 6
  party: Libertarian
  question: co-q1
  date: 2026-09-08
  primary_candidate: false
  response: |
      "Science allows us to ask, “What if?" and because America asks these questions, it became a leader in innovation.
      
      In the late 1980s, the federal government funded research into autonomous land vehicles. At the time, a vehicle that could drive itself was literally a television show. But someone was willing to convince Congress to ask the question and give American scientists and engineers the resources to explore the answer. Decades later, we have self-driving vehicles.
      
      That is one of the roles I believe government can play in science. NASA did it when we looked toward space. Government-supported research helped lay foundations for technologies that transformed our lives. Not every question has an immediate commercial application or a profit line attached to it so I appreciate the hesitancy when a for-profit enterprise doesn't want to explore it. But that doesn't mean we shouldn't explore simply because we don't yet know what is possible.
      
      In America, we have an extraordinary history of making the impossible possible. And sometimes the government needs to help this along.
      
      I would bring that same curiosity to policymaking. I want scientists, engineers, universities, national laboratories, businesses and other experts at the table. I want competing evidence. I want assumptions challenged. I want to know what we know, what we don't know, and what questions we haven't thought to ask yet.
      
      Science should inform government decisions, but I also want government to continue investing in the freedom to explore.
      
      Because somewhere, someone is asking “What if?” about something the rest of us think is impossible and I want America to be the country that says, “Let's find out.”"

- candidate_first_name: Patty
  candidate_last_name: McMahon
