      "The urgency around building data centers in Colorado is being manufactured rather than earned. There are many other places in the U.S. suitable for these facilities, and we don't yet know the full environmental and societal impact of siting them here. I believe the right path forward is a statewide moratorium on new data center development until we have that information. During the moratorium, I would want evidence-based data on the impact to  water and energy infrastructure, the direct and indirect costs to residents, and the effects on our land and environment. That evidence should inform a risk-benefit analysis and a set of guardrails, so that when development resumes, it protects our communities and natural resources while still allowing responsible business growth. My inclination is toward stricter environmental protections, particularly limits on carbon emissions, safeguards for water resources, and standards addressing noise pollution and heat-island effects. In addition, I would push for those protections to be built into any framework that comes out of this process."

- candidate_first_name: Dr. Maureen 'Mo'
  candidate_last_name: Dower
  state: co
