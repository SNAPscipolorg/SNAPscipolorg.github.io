      "I believe Colorado’s science education should focus on teaching students how to evaluate evidence and think critically, not simply what conclusions to reach.
      
      Students need a strong foundation in the sciences, mathematics, technology, agriculture, and geography, but they also need to understand how scientific knowledge is developed - how to ask good questions, evaluate evidence, test assumptions, recognize uncertainty, and adjust conclusions when credible new information emerges.
      
      These skills extend well beyond the classroom. They help students evaluate information, understand technology, make informed decisions, and participate thoughtfully in our society.
      
      I would support rigorous, age-appropriate science standards and stronger connections between classrooms and real-world applications. Partnerships with agriculture, healthcare, engineering, energy, natural-resource industries, skilled trades, colleges, and universities can demonstrate how science is used every day and introduce students to Colorado career opportunities.
      
      Teachers should be supported in teaching rigorous academic content without turning science education into political or social advocacy. Social agendas should not drive science education in our schools, and political or ideological objectives should never override established scientific evidence. Students should be encouraged to respectfully question, challenge assumptions, and understand that legitimate scientific inquiry can involve uncertainty and evolving conclusions.
      
      Our goal should be graduates who are scientifically literate, curious, independent thinkers, and confident enough to ask good questions. Those skills will serve them throughout their lives."

