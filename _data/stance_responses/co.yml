      "There are two prongs to this, so let's start with the AI itself.  We can be absolutely certain that humanity will go extinct at some point in the future.  The last human from Earth will die.  Artificial Intelligence has the capacity to carry on the legacy of humanlike consciousness long after that time, and it it worth advancing and preserving for that reason.
      
      Data Centers were already becoming the central nervous system of our civilization before the AI boom.  Like them or not, you're using them.  Honestly, we need to work toward orbital data centers to mitigate the terrestrial impacts.  In the meantime, we need to require on-site power generation through wind, solar, and geothermal stations that can cover the power requirements, and we need to require closed-loop cooling systems."

