      "As sad as it sounds, we need to get back to the point where people actually understand the disease theory of infection and can internalize what that means.  We need to be clear in our language, and instead of creating text message friendly names for things, we need to foster a multi-syllabic vocabulary in our population so that people can better understand what is going on.  The ongoing degradation of our language is also degrading people's ability to comprehend, and that is causing people to gravitate to very silly things instead of proven methods and cures."

