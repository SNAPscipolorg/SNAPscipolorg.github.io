      "As a large animal veterinarian with a career built in Colorado agriculture, I bring hands-on, science-based experience to this role. This is firsthand experience with what growers and producers face day to day. That background lets me evaluate research and legislation on its merits, informed by my professional training and ongoing continuing education. On water scarcity, I would push to incentivize efficient irrigation and conservation practices led by the people who steward our water best: our farmers, growers, ranchers, and producers, rather than imposing uninformed mandates. I would also support funding for additional water storage, like reservoirs, and for modernizing distribution infrastructure, like upgrading irrigation ditches, so more of the water we have actually reaches the land that needs it."

- candidate_first_name: Dr. Maureen 'Mo'
