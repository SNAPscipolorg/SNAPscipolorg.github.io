  question: co-q4
  date: 2026-05-29
  primary_candidate: true
  response: |
      "I believe public health policy should be guided by evidence, transparency, and prevention. The recent measles outbreaks in Colorado remind us that infectious diseases do not recognize political boundaries, and that strong public health systems remain essential to protecting our communities.
      I am proud that Broomfield has consistently maintained high childhood vaccination rates compared to many communities across the country. Those high vaccination rates help protect not only individuals, but also infants, seniors, cancer patients, and others who may be especially vulnerable to infectious diseases. When measles cases were identified in our community, the Broomfield Department of Public Health and Environment acted quickly alongside state and regional partners to notify the public, identify potential exposure locations, conduct contact tracing, and provide clear guidance to families, schools, and healthcare providers. These rapid response measures help contain outbreaks before they become larger public health emergencies.
      During COVID, I advocated for access to vaccines at the workplace and worked with businesses to provide access. Going forward, I support evidence-based investments in public health infrastructure, disease surveillance, vaccination access, health education, and emergency preparedness. Public health agencies need the resources to detect outbreaks early, communicate accurate information quickly, and coordinate effectively with schools, healthcare providers, and local governments. I also support expanding access to preventive healthcare services so that cost, transportation, or language barriers do not prevent families from receiving recommended care.
      Beyond infectious diseases, preventive health includes addressing environmental health risks, air and water quality, mental health, chronic disease prevention, and preparedness for climate-related health impacts such as extreme heat and wildfire smoke. The most effective public health policies are often the ones that prevent problems before they occur.
      As a legislator, I would continue to support science-based public health policies that respect private health concerns, while recognizing our shared responsibility to protect community health. My goal is to ensure that Colorado families have access to accurate information, preventive care, and a strong public health system that is prepared to respond to both current and emerging health threats."

- candidate_first_name: Heidi
  candidate_last_name: Henkel
