    As the lowest lying state, Delaware is on the front line of sea level rise. We are already facing the effects of tidal and inland flooding as well as salt water intrusion. NOAA now estimates that tidal areas could see flooding on more than 100 days per year by 2050. That’s a dramatic increase from the dozen or so we see today. I support significantly increasing our preparedness and taking action on multiple fronts.

    Flood Mitigation
    - Restore the ecosystems that dampen the effects of storms and protect against erosion like coastal wetlands, dunes, and reefs. Consider the addition of artificial reefs offshore to decrease erosion.
    - Invest in green infrastructure and stormwater management projects like bioswales, rain gardens, and permeable ground surfaces.

    Sustainable Development
    - Update building codes to sustainable standards for the future such as requiring designs that anticipate higher flood elevations or temperature extremes.
    - Elevate our energy infrastructure to increase its resilience.

    Resident Protections
    - Prepare for the possibility of strategic retreat wherein the state would support voluntary relocation for people and infrastructure located in areas facing severe risk.

