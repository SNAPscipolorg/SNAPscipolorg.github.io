    This session I supported HB 233, requiring Delmarva to create a separate rate class and blocking large facilities from connecting until they sign binding cost-protection agreements (they're also first curtailed in emergencies unless they bring their own power). I also supported HB 445, requiring facilities to produce or procure 100% of their own energy within 10 years, partly renewable. And finally, I voted for SB 326, which caps Delmarva's non-mandatory infrastructure spending and tightens rate oversight.

    I'm not opposed to a moratorium in principle, but a pause only helps if the time is used to build real guardrails. Delaware has already done much of that work through these bills and the PSC's large-load tariff docket. I'd favor a narrow, targeted pause over a blanket one duplicating existing efforts, paired with strict cost allocation, mandatory disclosure, non-by-right siting, and real community engagement requirements.

