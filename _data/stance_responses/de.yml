    I believe Delaware should address youth substance use through prevention, education, early intervention, and treatment—not simply punishment. The decline in the number of young people who perceive regular marijuana use as risky tells us we need honest, age-appropriate education about marijuana, vaping, opioids, alcohol, and prescription-drug misuse before unhealthy patterns begin.

    I support evidence-based prevention programs in schools and communities, greater access to behavioral health and substance-use counseling, and training for parents, educators, and mentors to recognize warning signs and connect young people with help early. Delaware should continue using the Delaware School Survey and other public-health data to measure which programs actually reduce youth substance use and direct funding toward approaches producing results.

    Prevention also means investing in young people themselves. Mentoring, recreation, arts, workforce development, and meaningful after-school opportunities can strengthen the protective factors that keep young people connected and engaged.

    Adult legalization should never mean normalization of drug use among children. Our responsibility is to educate young people honestly, intervene early, and give them healthy opportunities to thrive.

