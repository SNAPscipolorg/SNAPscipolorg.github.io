  county_race:
  primary_candidate: false
  response: |
    Delaware should welcome innovation and jobs, but not on the backs of families, seniors, and small businesses. Data centers and AI companies that require enormous amounts of electricity must pay their fair share for the new generation, transmission, substations, and grid upgrades they make necessary not shift those costs onto ratepayers.

    I support transparent, independent cost and reliability reviews before large projects are approved; binding commitments on electricity use and construction timelines; and requirements that major new loads help provide reliable power or reduce demand during grid emergencies. We should also press PJM for honest forecasting, faster accountability, and no grid capacity reservations for speculative projects.
    Delaware needs practical, all of the above energy policy: protect dependable generation, build needed infrastructure, encourage efficiency and storage, and judge every proposal by reliability and cost not politics.

    Innovation is welcome. Corporate welfare on your electric bill is not.

- candidate_first_name: Dan
  candidate_last_name: Zitofsky
  state: de
  race: State House of Representatives
  district: 4
  party: Republican
  question: de-q3
  date: 2026-08-09
  county_race:
  primary_candidate: false
  response: |
    Coastal flooding is not a theory for Delaware families. It is already affecting roads, homes, businesses, drinking water, and access for coastal communities. We should meet that challenge with practical solutions that protect both people and property rights.

    I support using the best available flood data to guide infrastructure investments, strengthen drainage, elevate vulnerable roads and utilities, and improve emergency alerts. We should prioritize proven protections such as beach restoration, dunes, wetlands, living shorelines, and better stormwater systems where they make sense.

    Homeowners and local governments need access to grants, flood mitigation funding, and clear, honest information about risks before they buy, build, or rebuild. State government should be a partner, not impose one size fits all mandates from Dover.
    When a community faces repeated severe flooding, residents must have a real voice in deciding whether to protect, elevate, rebuild, or pursue voluntary buyouts.

    Our goal should be simple: protect Delaware communities, protect taxpayer dollars, and protect the right of families to make informed decisions about their homes.

- candidate_first_name: Dan
  candidate_last_name: Zitofsky
  state: de
  race: State House of Representatives
  district: 4
  party: Republican
  question: de-q9
  date: 2026-08-09
  county_race:
  primary_candidate: false
  response: |
    Delaware must be honest with young people about the risks of drug use and give parents, teachers, and communities the tools to act early. When fewer students see regular marijuana use as harmful, we cannot respond with silence or slogans.

    I support funding prevention programs that have evidence of results, including school based education that teaches students how to handle peer pressure, family programs that help parents have informed conversations, and mentorship and after school opportunities that give young people support and purpose.

    Schools should have access to trained counselors and straightforward referral systems so students showing early signs of substance use can get help before a mistake becomes an addiction. Parents must be informed and involved, while student privacy and due process are respected.

    I also support clear enforcement against selling or marketing marijuana, vaping products, alcohol, or illegal drugs to minors.
    Every program receiving taxpayer funding should measure outcomes and prove it is reducing youth drug use.

    Our message should be clear: Delaware believes in second chances, but we will do everything possible to prevent a child from needing one.

