  response: |
    Delaware families should not subsidize an AI buildout whose costs and risks are hidden. I would require large data-center loads to disclose projected demand, generation and transmission needs, water use, backup power, emissions, and who pays. FERC and PJM rules should require credible load forecasts, transparent interconnection studies, cost causation, and enforceable protections against shifting data-center-specific infrastructure costs onto households and small businesses.

    Reliability comes first: new large loads should bring or contract for deliverable capacity, flexibility, storage, or other resources sufficient to avoid weakening the grid. Any federal subsidy should carry labor, efficiency, water, community-benefit, and public-reporting conditions, with periodic review if promised jobs or resource performance do not materialize.

    AI can be foundational infrastructure for science, but importance is not entitlement. Reliable, affordable energy is a right; a data center is not. Communities must be able to set terms for the power, water, land, and public burden they are asked to carry, while preserving federal and state roles rather than pretending Washington directly sets Delaware retail rates or local siting decisions.

- candidate_first_name: Jeff
