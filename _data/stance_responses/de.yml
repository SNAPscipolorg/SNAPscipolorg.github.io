    To protect Delaware residents from rising electricity costs and grid reliability risks driven by AI-driven data center growth, I support policies that prevent corporate energy burdens from being socialized onto everyday ratepayers. This includes establishing strict Public Service Commission oversight and special tariffs for high-energy facilities, requiring tech operators to fund necessary grid infrastructure and transmission upgrades directly, bringing rigor and transparency to regional PJM load forecasting, and collaborating regionally to advocate for wholesale market reforms that keep power affordable and reliable.

