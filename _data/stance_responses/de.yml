    As a coastal state, Delaware is already experiencing the impacts of sea level rise, stronger storms, and more frequent tidal flooding. The science is clear that we must prepare our communities while protecting both our environment and our economy.

    I was proud to co-sponsor legislation strengthening Delaware's wetlands protections because healthy wetlands are one of our most effective natural defenses against flooding. As a member of the House Natural Resources & Energy Committee, I have consistently supported policies that recognize protecting our environment is also an investment in our economy, our infrastructure, and our quality of life.

    I support continued investments in living shorelines, marsh restoration, resilient infrastructure, improved stormwater management, and voluntary home elevation and flood mitigation programs. I also believe every major infrastructure and land use decision should account for future flood risk using the best available science.

    Protecting Delaware's coast requires partnership among state agencies, local governments, property owners, and conservation organizations. By making evidence-based investments today, we can better protect our communities, preserve our natural resources, and ensure future generations can continue to call Delaware's coast home.

