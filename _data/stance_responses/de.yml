    Protecting Delaware’s youth from substance abuse requires a balanced approach focused on prevention, education, accountability, and access to resources. I support evidence-based prevention programs that provide students with accurate information about the risks of drug and alcohol use, while also strengthening partnerships between schools, families, law enforcement, healthcare providers, and community organizations.
    We should evaluate programs based on measurable outcomes and invest in approaches that are proven to reduce substance use, not simply increase spending without results. Early intervention, mental health resources, mentoring programs, and support for families are important tools in preventing addiction before it begins.
    Marijuana and other substance use among youth should not be normalized. Delaware should continue using data to guide policy decisions and ensure we are helping young people make informed choices that protect their health and future.

- candidate_first_name: Dan
  candidate_last_name: Zitofsky
  state: de
  race: State House of Representatives
  district: 4
  party: Republican
  question: de-q2
