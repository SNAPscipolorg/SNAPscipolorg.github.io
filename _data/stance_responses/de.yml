    I would fund science as public infrastructure: stable, multi-year support for basic and translational research; competitive peer review; public-health, climate, energy, materials, computing, and social science; modern facilities; and a skilled workforce. High-risk work needs time beyond an election calendar; clear criteria, conflict disclosure, audits, and honest negative findings protect public trust.

    That judgment is practical. My first classroom assignment was honors and general eighth-grade physical science. At APS, I applied that experience to our America 250 project, America’s Scientific Revolutionaries. I presented its research and public-education work at Science on Tap; its programs have included MIT astrophysicist and exoplanet pioneer Sara Seager and CHOP vaccine scientist Paul Offit. Sustained support becomes discovery, education, and public understanding—not merely a line item.

    Geophysicist Marcia McNutt, who led the National Academy of Sciences until earlier this year, described science during her ASR program as how we escape a zero-sum game. Public funding should expand capacity and public return: usable access; responsible technology transfer; broad geographic and institutional opportunity; secure stewardship of sensitive data. AI should expand research capacity, not replace scientific judgment or consume public resources without transparent terms.

