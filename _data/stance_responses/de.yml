    To address youth substance use and counter the decline in perceived risk, I support modernizing our prevention strategies with evidence-based education. We need robust, peer-reviewed prevention programs in our schools that provide accurate information regarding the physiological impacts of high-potency products, synthetic drugs, and cannabis on developing brains. Furthermore, I support directing state resources to expand youth mental health services, early intervention counseling, and after-school community programs that address the root causes of substance use, ensuring our schools and public health agencies work hand-in-hand to keep students safe.

