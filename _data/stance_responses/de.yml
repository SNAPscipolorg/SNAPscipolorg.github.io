    I'd support modernizing stormwater and combined sewer infrastructure statewide, with funding prioritized toward historically underserved and flood-prone communities in Wilmington and Newark as well as coastal Sussex. I'd back updating floodplain maps to reflect future rainfall and runoff patterns, not just historical data, and continued investment in projects like the Southbridge Wetlands Park model, which includes green infrastructure paired with real community input to avoid displacement. I'd also support voluntary buyout and elevation programs for repetitive-loss properties statewide, and codifying the state's flood-risk-avoidance standard into law so it can't be undone by executive order alone.

