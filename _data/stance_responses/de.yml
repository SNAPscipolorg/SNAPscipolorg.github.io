    Fraudulent health claims are a serious public safety threat. While Delaware’s Consumer Protection Unit under AG Jennings handles standard consumer fraud, enforcement around misleading health claims has remained largely complaint-driven—reacting only after Delawareans have already suffered financial loss or health harms.

    My administration will transform consumer protection from a reactive agency into a proactive watchdog. We will establish a dedicated science and health advocacy pipeline within the Consumer Protection Unit, partnering directly with medical research institutions, public health experts, and federal regulators (FDA/FTC) to actively monitor deceptive marketing trends before widespread harm occurs.

    We will aggressively target predatory companies exploiting seniors, chronic illness patients, and low-income families seeking accessible care with unproven medical claims. Furthermore, we will move beyond standard financial settlements—which large corporations treat as a cost of doing business—by prioritizing immediate injunctive relief to halt deceptive sales instantly, securing full restitution for defrauded consumers, and seeking structural remedies that prevent repeat offenses in Delaware.

