    Delaware should welcome innovation and economic growth, but we must ensure that large-scale data center development does not shift unnecessary costs or reliability risks onto Delaware families and small businesses. I support evidence-based planning that requires transparency from large energy users, including evaluating their impact on grid capacity, infrastructure needs, and ratepayers. Data centers should be responsible partners in meeting the energy demands they create, including exploring options such as direct investment in grid improvements, energy efficiency measures, and responsible energy solutions.
    We must work with PJM and utility providers to use reliable data and long-term forecasting when making decisions. At the same time, Delaware should continue pursuing a diverse energy portfolio that prioritizes reliability, affordability, and innovation while protecting consumers from avoidable cost increases.

- candidate_first_name: Jacki
  candidate_last_name: Slonin
