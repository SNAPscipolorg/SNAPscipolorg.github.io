    Delaware families are struggling with rising electricity costs, and they should not be asked to subsidize the enormous energy demands of the wealthiest corporations in the world. Data centers should not come to Delaware. If they do, we need to make sure they pay their fair share, bring new clean energy onto the grid, and don’t make electricity less affordable or reliable for everyone else.

    I support creating a separate rate structure so large data centers bear the transmission and distribution costs they create rather than shifting them onto households and small businesses (HB 233). I also support requiring data centers to produce or procure enough clean energy to meet their demand (HB 445), and stronger oversight of utility infrastructure spending so families aren’t left paying for investments primarily serving large industrial customers (SB 326).

    I would also require local approval and a transparent public process before large-scale data centers can be built, including review of impacts on energy costs, grid reliability, water use, and our environment. If we cannot guarantee that new data centers will not raise residents’ utility bills or harm surrounding communities, I support stopping new development until those protections are in place.

