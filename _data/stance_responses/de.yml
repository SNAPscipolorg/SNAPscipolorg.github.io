    Energy is one of the most critical issues facing our community. This is not just the work of this legislative session. It is generational work that will shape Delaware's economy, environment, and quality of life for decades to come.

    As a member of the House Natural Resources & Energy Committee, I believe the conversation around energy is moving too quickly without enough independent, peer reviewed research to fully inform the decisions before us. The first step should always be following the best available science and objective data. That evidence must be the foundation for every conversation about energy policy, whether we are discussing data centers, grid reliability, electricity costs, or future energy generation.

    The rapid growth of AI driven data centers requires us to carefully weigh competing priorities. That balance can only be achieved by grounding our decisions in independent, peer reviewed research and thoughtful long-term planning. While data centers may strengthen our economy, they also pose real risks to our electric grid, our environment, and the long-term affordability of energy for Delaware families. These concerns are especially important in the coastal communities I represent in Sussex County, where increased energy demand and environmental impacts could have lasting consequences. No matter what policies are ultimately adopted, the impacts on our climate and environment must remain central to every decision.

    I support requiring large energy users to pay their fair share of the infrastructure costs they create rather than shifting those costs onto Delaware ratepayers. I also support strengthening long term grid planning through PJM, investing in transmission infrastructure, expanding energy efficiency, and carefully evaluating the cumulative impacts of proposed data centers before projects are approved.

    Delaware should welcome innovation, but not at the expense of affordability, grid reliability, or our natural resources. Evidence, transparency, and long-term planning must guide every decision we make because the choices we make today will affect generations of Delawareans to come.

