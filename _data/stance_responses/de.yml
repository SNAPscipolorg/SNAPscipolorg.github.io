    As Attorney General, I will make Delaware an active, leading force in multistate legal action rather than a passive participant. While Delaware joined multi-state opioid litigation under AG Kathy Jennings, our state too often signs onto national lawsuits after other states have done the heavy lifting—or sits on the sidelines entirely during crucial corporate challenges, such as major anti-competitive media mergers.

    My decision framework will proactively evaluate three criteria:
    1) Direct Impact on Delawareans: Actionable harm to our residents, particularly frontline and historically underrepresented communities facing environmental or healthcare barriers.
    2) Scientific & Empirical Consensus: Prioritizing actions grounded in rigorous research, including defending reproductive health equity, protecting climate regulations, and curbing toxic industrial emissions.
    3)Federal Inaction: Stepping in aggressively when federal regulators lapse or fail to hold national corporate monopolies accountable.

    Rather than viewing Delaware as the state of incorporation that avoids rocking the boat, my administration will leverage our unique corporate and legal standing to co-lead multistate coalitions early. We will initiate enforcement actions that set nationwide precedents for public health, clean water, and consumer safety.

