    To help Delaware's coastal communities respond to increasing tidal flooding and sea level rise, I support a proactive, science-driven resilience strategy. This includes investing in nature-based solutions like wetland restoration and living shorelines to naturally absorb storm surges, updating state infrastructure and building codes to withstand higher water baselines, and incorporating NOAA and local data projections directly into municipal land-use planning. Additionally, I support empowering local governments with technical and financial resources (such as expanding participation in FEMA's Community Rating System) to protect vulnerable properties, secure evacuation routes, and safeguard our coastal economy without placing an unfair burden on local taxpayers.

