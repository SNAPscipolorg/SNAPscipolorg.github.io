    The major concerns I have, and what I’ve heard from residents, are how data centers will increase our electric bills, affect our sleep and health, reduce our water quality and availability, decrease our property values, pollute our air with diesel generators, and harm our struggling wildlife populations.

    At a state level I would:
    - Support a data center moratorium
    - Require data centers to pay for their own power generation and system upgrades instead of shifting costs to regular ratepayers
    - Support a special tariff for large-load customers, including data centers, with demand of more than 75 megawatts
    - Phase in renewable power purchase agreements specifically for data centers
    - Mandate data centers reduce power usage during peak-demand events to stabilize local grids

