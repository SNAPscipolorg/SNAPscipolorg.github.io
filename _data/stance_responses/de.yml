  primary_candidate: false
  response: |
    As someone with a terminal research degree, I would start with competence and integrity: substantial experience in the science an agency supports, demonstrated respect for peer review and reproducibility, and the ability to manage a large public institution. A nominee should disclose conflicts, protect research from partisan or commercial interference, explain uncertainty honestly, and defend the lawful work of career scientists.

    Science can tell us what evidence supports; it cannot by itself settle questions of values, budgets, or rights. I would therefore ask whether a nominee can translate evidence into decisions without hiding those democratic choices behind expertise.

    The Senate's job is not to demand ideological conformity. It is to determine whether a nominee will steward public money, preserve public trust, publish methods and results where law permits, correct errors openly, and keep an agency capable of serving the whole country. I would reject a nominee who treats expertise as a loyalty test, suppresses inconvenient findings, or confuses scientific leadership with obedience to a president or donor.

