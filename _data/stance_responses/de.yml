    Delaware’s coastal communities are a vital part of our state’s economy, heritage, and way of life. I support using reliable data and scientific research to better understand coastal flooding risks and make responsible decisions. We should prioritize practical solutions such as improving stormwater management, maintaining and strengthening critical infrastructure, preserving natural protections like wetlands where appropriate, and ensuring communities have access to accurate information and emergency preparedness resources.
    Any policies should balance environmental concerns with the needs of homeowners, farmers, businesses, and local governments. Decisions should be based on evidence, cost-effectiveness, and long-term planning rather than fear or politics. Delaware must be proactive in protecting residents and infrastructure while respecting property rights and the unique character of our coastal communities.

