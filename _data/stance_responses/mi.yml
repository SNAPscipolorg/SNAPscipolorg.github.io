  state: mi
  race: US House of Representatives
  district: 1
  party: Democratic
  question: mi-q2-all-races
  date:
  primary_candidate: true
  response: |
    "Government should invest where the private sector won't—or can't—because that's often where the biggest breakthroughs begin. Many of the technologies we rely on today—from the internet and GPS to life-saving medical treatments—grew out of public research before becoming private-sector success stories.
    
    As an Industrial Designer, I've spent my career turning ideas into products. Innovation happens when researchers, entrepreneurs, manufacturers, and workers all have a seat at the table. Government's job isn't to pick winners—it's to create the conditions where innovation can thrive.
    
    I'd prioritize investments that improve people's lives and strengthen America's competitiveness: medical research, advanced manufacturing, clean energy, agriculture, Great Lakes protection, rural healthcare, and technologies that create good-paying jobs here in Michigan instead of overseas.
    
