- candidate_first_name: Wayne
  candidate_last_name: Stiles
  state: mi
  race: US House of Representatives
  district: 1
  party: Democratic
  question: mi-q1-all-races
  date:
  primary_candidate: true
  response: |
    "Scientific evidence should be the starting point—not the finish line. Good policy comes from combining the best available research with real-world experience, local knowledge, economics, and the values of the people we represent.
    
    As an Industrial Designer, this is how I've solved problems my entire career. You gather the facts, test assumptions, listen to experts, build a solution, and improve it as new information becomes available. Science isn't about always being right—it's about getting closer to the truth.
    
    That also means being honest when the evidence changes. If new research points in a better direction, changing course isn't weakness; it's good leadership. I'd rather explain why we're updating a plan than pretend we knew everything from the beginning.
    
    People don't expect certainty from Congress. They expect honesty, transparency, and decisions based on evidence instead of politics or special interests. That's how trust is built—and how better policy gets made."

    KEYWORDS: Evidence-Based Policy, Transparency, Problem Solving

- candidate_first_name: Wayne
