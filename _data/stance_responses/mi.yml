    "Clean water isn't a partisan issue—it's a basic responsibility. The Great Lakes hold nearly 20% of the world's surface fresh water. Protecting them isn't just good environmental policy; it's essential to Michigan's economy, public health, tourism, and way of life.
    
    I support sustained federal investment to replace aging water infrastructure, remove lead service lines, accelerate PFAS cleanup, modernize wastewater systems, and help rural communities afford these upgrades. Too many small towns simply don't have the tax base to tackle these projects alone.
    
    We also need to hold polluters accountable, strengthen scientific monitoring of our waterways, and invest in technologies that detect contamination earlier and clean it up more effectively.
    
    Protecting our water isn't about choosing between the environment and the economy. In Michigan, they're the same thing."

    KEYWORDS: Great Lakes, PFAS Remediation, Water Infrastructure

