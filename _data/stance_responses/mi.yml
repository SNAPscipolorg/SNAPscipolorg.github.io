  question: mi-q9-governor-house
  date:
  primary_candidate: true
  response: |
    "Artificial intelligence has enormous potential, but Michigan's natural resources are not for sale. If AI data centers want to locate here, they should meet Michigan's standards—not ask Michigan to lower them.
    
    I support federal policies that give local communities the legal and financial backing to negotiate with large corporations on equal footing. Local governments should have the authority to approve projects, require full transparency, and negotiate binding Community Benefit Agreements.
    
    AI developers should add new clean generating capacity so existing residents and businesses don't subsidize their electricity demand. They should also protect our water resources, pay the full cost of any infrastructure they require, and provide meaningful, ongoing tax revenue to the communities that host them.
    
    Finally, I support mandatory decommissioning bonds and legally enforceable site restoration requirements so taxpayers are never left with abandoned facilities or cleanup costs. Michigan has seen too many outside interests profit from our land and resources while local communities assume the risks.
    
    Innovation is welcome. Extractive business models are not. My priority is protecting the Great Lakes while ensuring any development leaves our communities stronger than it found them."

    KEYWORDS: Community Benefit Agreements, Resource Stewardship, Site Restoration
    
