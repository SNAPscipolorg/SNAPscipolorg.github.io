    "Scientific evidence and expert input should play a central role in policymaking, but experts should inform decisions, not replace democratic accountability. My background in anthropology, federal healthcare, and technology taught me to evaluate peer-reviewed research, understand the limits of data, and ask who is affected by a policy in practice.
    
    When evidence is incomplete or evolving, government should be honest about uncertainty rather than pretending every answer is settled. Policymakers should explain what is known, what is not known, what risks are involved, and why a decision is being made. As new evidence emerges, policy should be reviewed and adjusted accordingly. Good government requires humility, transparency, and a willingness to change course when the facts change."

    KEYWORDS: Evidence, Transparency, Accountability

