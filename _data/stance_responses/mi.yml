- candidate_first_name: Zebulon
  candidate_last_name: Featherly
  state: mi
  race: US House of Representatives
  district: 1
  party: Independent
  question: mi-q1-all-races
  date:
  response: |
    "Scientific evidence and expert input should play a central role in policymaking. Elected officials are not expected to be experts in every field, but they are responsible for listening to people who have spent years studying the issues and for making decisions based on the best available evidence. 
    
    At the same time, expertise must be communicated clearly. The public deserves to understand not only what experts recommend, but why they recommend it, what evidence supports it, and where uncertainty still exists. I would avoid pretending that science always provides immediate or absolute answers. When evidence is incomplete or evolving, I would explain what is known, what remains uncertain, and what new information could change the decision.
    
    Good policy should be willing to adapt as evidence improves. Changing course in response to better information is not weakness; it is responsible government. My role would be to bring together scientific expertise, public concerns, and practical realities, then communicate those decisions honestly and in language people can understand."
    
    KEYWORDS: Expertise, Transparency, Communication

- candidate_first_name: Zebulon
  candidate_last_name: Featherly
  state: mi
  race: US House of Representatives
  district: 1
  party: Independent
  question: mi-q2-all-races
  date:
  response: |
    "Government has an important role in supporting scientific research and innovation, especially when the benefits are broad, long-term, or too uncertain for private companies to pursue alone. Public investment has helped drive advances in medicine, energy, communications, manufacturing, and many other parts of modern life.
    
    I would prioritize research that improves quality of life, strengthens the economy, lowers costs, and helps the United States remain competitive. That includes work that makes healthcare more effective, energy more affordable, infrastructure more resilient, and new technologies safer and more useful.
    
    At the same time, public funding should come with accountability. Investments should be evaluated based on whether they produce meaningful knowledge, practical benefits, good-paying jobs, and results that serve the public rather than only a small group of private interests.
    
    Innovation should help move us into the future by making life healthier, more efficient, more affordable, and more enjoyable. I genuinely look forward to what tomorrow can bring, and I believe government should help create the conditions for discovery while making sure the benefits are widely shared."    
    
    KEYWORDS: Innovation, Quality of Life, Accountability

- candidate_first_name: Zebulon
  candidate_last_name: Featherly
  state: mi
  race: US House of Representatives
  district: 1
  party: Independent
  question: mi-q3-house-senate
  date:
  response: |
    "I am not a farmer, and I would not pretend to understand every challenge farmers face better than the people doing the work. Good agricultural policy should begin by listening directly to farmers, agricultural researchers, extension specialists, and rural communities.
    
    Different farms face different conditions, so policy should not be built around a single national model. Congress should help farmers manage risks they cannot control, including severe weather, crop disease, volatile markets, and rising input costs. That means strengthening crop insurance and disaster assistance, investing in rural infrastructure, and supporting research that improves drought tolerance, soil health, water efficiency, disease resistance, and productivity.
    
    We should also address the pressure farmers face from concentrated corporate power in seed, fertilizer, equipment, processing, and distribution markets. Innovation should give farmers more options, not make them more dependent on a small number of large companies.
    
    My role would not be to tell farmers how to farm. It would be to listen, remove unnecessary barriers, support practical research, and make sure farmers have the tools and fair markets they need to remain productive and profitable."
        
    KEYWORDS: Listening, Resilience, Fair Markets 

- candidate_first_name: Zebulon
  candidate_last_name: Featherly
  state: mi
  race: US House of Representatives
  district: 1
  party: Independent
  question: mi-q4-governor-house
  date:
  response: |
    "Clean drinking water should be treated as essential infrastructure. Congress should invest in replacing aging pipes, upgrading water-treatment systems, improving wastewater infrastructure, and helping small and rural communities access funding they may not have the staff or tax base to pursue on their own.
    
    PFAS and other contamination also require stronger federal responsibility. Where pollution was caused by military, industrial, or other identifiable sources, those responsible should help pay for testing, cleanup, filtration, and long-term monitoring. Communities should not be left carrying the financial burden of contamination they did not create.
    
    I would also support continued investment in Great Lakes research, watershed restoration, and prevention. Protecting drinking water means stopping pollution before it spreads, improving monitoring, and maintaining infrastructure before it fails.
    
    These programs should be transparent and focused on measurable results: safer water, fewer service interruptions, reduced contamination, and lower long-term costs. It is usually less expensive to replace failing infrastructure and prevent pollution than to respond after a system breaks down or a water source becomes unsafe."
    
    KEYWORDS: Clean Water, Accountability, Prevention 

- candidate_first_name: Zebulon
  candidate_last_name: Featherly
  state: mi
  race: US House of Representatives
  district: 1
  party: Independent
  question: mi-q5-governor-house
  date:
  response: |
    "Northern Michigan needs more healthcare professionals, but recruiting them is only part of the solution. Congress should expand incentives such as scholarships, loan repayment, and residency programs for doctors, nurses, mental health professionals, and other providers who commit to serving rural communities. We should also support rural hospitals, community health centers, and mobile clinics so essential services remain available close to home.
    
    Emerging technology can help expand access to specialty care. Telehealth allows patients to consult specialists without traveling several hours, while remote monitoring and improved diagnostic tools can help providers manage chronic conditions and identify problems earlier. These tools require reliable broadband and should support—not replace—local healthcare professionals and in-person care.
    
    We must also address the cost of healthcare. Access means little if patients cannot afford appointments, medications, or treatment. My long-term goal is universal healthcare that guarantees care regardless of income or location.
    
    Technology should reduce distance, cost, and delays, while public policy builds a strong local workforce and keeps rural healthcare facilities open."
    
    KEYWORDS: Access, Rural Workforce, Telehealth

- candidate_first_name: Zebulon
  candidate_last_name: Featherly
  state: mi
  race: US House of Representatives
  district: 1
  party: Independent
  question: mi-q7-house-senate
  date:
  response: |
    "America will need more electricity, and no single source should carry the entire burden. I support an energy mix that includes wind, solar, battery storage, nuclear power, and a modernized electrical grid.
    
    Wind and solar can provide affordable, locally produced electricity without requiring a continuously transported fuel source. Nuclear power can provide reliable generation with low direct carbon emissions, but new projects must meet strict safety, waste-management, cost, and transparency standards. I also support continued research into advanced reactors, long-duration energy storage, grid technology, and other emerging systems that could improve reliability and reduce costs.
    
    Congress should invest in transmission and storage, support domestic manufacturing, and modernize permitting without weakening environmental review or meaningful community involvement. Large energy projects should not be forced onto communities, and residents should understand the costs, risks, and benefits before decisions are made.
    
    Our goal should be an energy system that is reliable, affordable, increasingly clean, and less dependent on imported or transported fuels. Expanding supply matters, but it must be done carefully and with the long-term public interest in mind."
    
    KEYWORDS: Energy Independence, Innovation, Reliability

- candidate_first_name: Zebulon
  candidate_last_name: Featherly
  state: mi
  race: US House of Representatives
  district: 1
  party: Independent
  question: mi-q9-governor-house
  date:
  response: |
    "Technological growth should be welcomed, but it must be planned responsibly. New data centers, factories, and energy-intensive industries should not be allowed to overwhelm local electrical grids, water systems, roads, or emergency services.
    
    I would support requiring large projects to disclose their expected energy, water, and infrastructure needs before approval. Companies should help pay for the upgrades their projects require rather than shifting those costs onto local residents through higher taxes or utility bills. Federal support should be tied to clear public benefits, strong environmental protections, and meaningful community involvement.
    
    Congress should also invest in grid modernization, energy storage, water infrastructure, broadband, and research into more efficient technologies. Improving efficiency can allow innovation to continue while reducing waste and pressure on natural resources.
    
    Environmental review should remain thorough, but the permitting process should also be clear and predictable. Good regulation should protect communities and ecosystems without creating unnecessary delays.
    
    Technological progress and environmental responsibility are not opposing goals. With careful planning and accountability, we can build the infrastructure needed for growth while protecting reliability, affordability, and the places people call home."
    
    KEYWORDS: Responsible Growth, Infrastructure, Sustainability

