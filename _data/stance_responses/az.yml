    Yes. The Mohave County measles outbreak was preventable, and it's a warning sign for LD1 and rural Arizona more broadly. As someone with a background in psychology and human behavior, I understand that public health failures are rarely about access alone. They're about trust, communication, and outreach failing to meet communities where they are.

    First, I support restoring and protecting state funding for county health department vaccination outreach, particularly in rural and tight-knit communities where distrust of state institutions runs deep and messaging must come from trusted local messengers, not just state press releases.

    Second, I support strengthening real-time public health data reporting between county, state, and federal health agencies, so outbreaks are identified and contained before they spread across county and state lines, as this one did between Arizona and Utah.

    Third, I support protecting reasonable school vaccination requirements while ensuring legitimate medical exemptions remain accessible, paired with transparent public data on vaccination rates by school and county so parents and health officials can identify gaps early.

    Fourth, I support funding mobile and school-based vaccination clinics for rural communities where distance and cost are real barriers, not just hesitancy.

    Public health policy has to be built on epidemiological evidence and delivered with cultural competence, not top-down mandates disconnected from community trust. That combination is where real outbreak prevention happens.

