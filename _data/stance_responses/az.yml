    I would also support competitive grants for universities, public research institutions, small businesses, and independent researchers developing new technologies. Funding decisions should be based upon scientific merit, potential public benefit, and transparent standards rather than political influence. Additionally, I would encourage stronger partnerships between federally funded researchers, universities, businesses, and communities so discoveries do not simply remain in laboratories but can be developed into useful technologies, products, and services.
    However, funding requires accountability. Research results, expenditures, conflicts of interest, and measurable outcomes should be disclosed. The purpose should be to create an environment where new ideas can be tested, challenged, improved, and ultimately benefit the public while the public is aware that the institutions are providing reliable information, not additional propaganda.

