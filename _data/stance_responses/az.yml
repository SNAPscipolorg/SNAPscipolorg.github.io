    Arizona is facing a genuine convergence of environmental pressures, and I support policies grounded in current data rather than assumptions. On water, Arizona is currently under a Bureau of Reclamation Level 1 Shortage Condition on the Colorado River, requiring the state to cut 512,000 acre feet of water for 2026, while Lake Mead sits around 32 percent full and Lake Powell around 24 percent full. At the same time, data center water use in the Phoenix area is projected to grow substantially in the coming years. I support requiring new data centers to disclose projected water and energy usage before receiving state incentives, and I support local ordinances, similar to those already adopted in Mesa, Avondale, and Phoenix, that cap industrial water use and require developers to secure supplemental water supplies rather than depleting local aquifers. Arizona currently relies on groundwater for 41 percent of its total water use, so protecting that resource is essential. On mining waste, I support continued state investment in research, such as the University of Arizona's ongoing work assessing whether the state's billions of tons of historic copper tailings can be safely reprocessed to reduce environmental risk while recovering critical minerals. On extreme heat, I support expanding funding for the Arizona Department of Health Services heat surveillance program and investing in shaded infrastructure and cooling centers in the districts most affected, particularly for outdoor workers and older residents.

