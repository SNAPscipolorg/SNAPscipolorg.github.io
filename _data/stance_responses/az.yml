    As a state senator, I won't control federal appropriations directly, but Arizona's state government plays a critical role in positioning our universities, research institutions, and workforce to compete for, and make full use of, federal science funding, and I intend to use every lever available.

    First, I will champion state matching-fund programs that make Arizona institutions more competitive for federal grants (NSF, NIH, DOE, DOD), particularly for water security, semiconductor research, solar and renewable energy, and public health, sectors where Arizona already leads and where federal dollars can be transformative for rural districts like LD1.

    Second, I will advocate for state-level infrastructure investment, broadband, lab facilities, and STEM workforce pipelines at community colleges like Yavapai College, that make our region ready for federal research partnerships instead of leaving that capacity concentrated in Phoenix and Tucson.

    Third, I will work to protect and expand technical and community college pathways into STEM careers, ensuring rural students in LD1 aren't cut off from the innovation economy.

    Fourth, I will use my voice in the legislature and in coalition with Arizona's congressional delegation to publicly oppose federal cuts to NSF, NIH, and other basic research funding, and to advocate for restoring funding where it has been slashed, because basic research is the foundation innovation is built on.

    Finally, as someone who has spent my career in higher education, I understand firsthand how fragile research funding pipelines are, and I will be a consistent, informed voice for protecting them at every level of government.

