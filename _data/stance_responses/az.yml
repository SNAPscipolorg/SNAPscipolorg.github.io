    Evidence and science should be a major part of policymaking because government decisions should be based on what actually works, not simply on political ideology. Science is not emotional nor supposed to be colored by bias. Therefore, I would support independent scientific councils made up of qualified experts who can review existing research, new data, and emerging technologies and provide objective recommendations. These councils should be nonpartisan, and their findings should be made public whenever possible.
    I would also support having chief science and data advisors within major federal departments. Their responsibility would be to protect research integrity, review the evidence being used by agencies, and make sure policymakers understand both what the research shows and the gaps in the knowledge, information. Additionally, I would also create stakeholder panels that include researchers, community members, technical experts, and the people actually affected by the policy. Experts can explain the science, but people living with the consequences of government decisions also need a voice.
    Finally, I believe the government should maintain transparent evidence registries showing the studies, data, and reviews used when developing major legislation or regulations. This is due to science being the mechanism upon which guides government decisions, but it should never operate behind closed doors. The evidence should be public, reviewable, and open to challenge when better information becomes available.

