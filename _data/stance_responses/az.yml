   I believe good policymaking begins with evidence before ideology and requires decision makers to actively seek out expertise, including perspectives that challenge their assumptions.

   As a legislator, I would support stronger, routine connections between the Legislature and Arizona’s universities, community colleges, scientific institutions, Tribal governments, professional associations, and researchers working directly in our communities. For major policy proposals involving areas such as water, public health, education, energy, wildfire, emerging technologies, or environmental management, I would seek input from relevant subject-matter experts early in the legislative process, not after legislation has already been written. I also support greater use of nonpartisan research staff, scientific advisory panels, public expert testimony, and legislative working groups that bring researchers together with community members, practitioners, businesses, and affected stakeholders.

   Just as importantly, we should evaluate policies after they are implemented. Whenever practical, legislation should establish measurable outcomes, appropriate data collection, and opportunities for periodic review so we can determine whether a policy is actually accomplishing its intended purpose.

   Science should not be partisan. Evidence cannot make every value judgment for elected officials, but it should clearly inform the choices before us. When credible new evidence shows that an existing policy is ineffective, I believe policymakers should be willing to change course.

