   I support reasonable protections for children and teenagers on social media, while protecting free speech and parental authority. Social media can provide valuable access to information, including science and public policy, but young people can also be exposed to misinformation, manipulation, harmful content, and addictive design features.

   I support stronger age verification and meaningful parental controls, particularly for younger children. Parents should have the ability to understand what platforms their children are using, control access when appropriate, and limit the collection and use of minors’ personal information.

   Social media companies should also be held accountable for protecting minors’ privacy and clearly disclosing how algorithms recommend content to young users. Platforms should not be allowed to deliberately exploit children’s vulnerabilities simply to increase engagement and advertising revenue.

