    My number-one strategy is to build a Legislature that treats Arizona’s environmental challenges as urgent, science-based policy priorities. Arizona is facing increasingly extreme heat, groundwater depletion, pollution from mining and other industrial activities, and new demands on our water and energy systems from the rapid growth of AI data centers. These issues require stronger oversight, transparency, and long-term planning.

    I'm part of an informal legislative climate caucus among House and Senate Democrats, and we are currently prioritizing legislation for the upcoming session. I hope to serve on the Natural Resources Committee, where I would work to advance practical policies that protect Arizona’s natural resources while recognizing the needs of communities and our economy.

    We are developing roughly 100 bills (some we have carried and adapted year to year)  addressing issues including data-center water and energy use, rural groundwater management, utility transparency and governance, PFAS and microplastic pollution, outdoor-therapy programs, the Green Amendment, and protections against extreme heat.

    For data centers in particular, I believe Arizona needs clear standards for water use, transparency about their impacts on local resources, and policies that ensure the costs of increased demand are not simply shifted onto residents and ratepayers. We need to immediately end the tax exemption for data centers, which is draining up to $60 million dollars from our state revenue. For groundwater, we need better monitoring and stronger management in rural areas where communities can be especially vulnerable to depletion -- in other words, we need to pass a Rural Groundwater Act

    We also need to address pollution from mining and abandoned mine sites through stronger monitoring, accountability, and cleanup efforts. Arizona tribal nations are disproportionately impacted. Arizona’s environmental agencies already identify abandoned mine lands as a significant potential threat to surface and groundwater resources. 

    Finally, extreme heat needs to be treated as a public-health and infrastructure issue, not simply as an unavoidable feature of living in Arizona. That means considering heat protections for workers, investments in shade and cooling infrastructure, and policies that help communities become more resilient.

    Arizona has the opportunity to grow its economy and embrace new technologies without sacrificing its water, health, and natural resources. My goal is to make sure environmental protection and responsible growth are addressed together, using sound science, transparency, and accountability.

