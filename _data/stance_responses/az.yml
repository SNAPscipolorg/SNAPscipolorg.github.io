    I support policies that protect young people online while respecting family decision making and personal privacy. Arizona House Bill 2991, introduced in 2026, would require social media platforms to obtain parental consent before allowing account holders under 14 to create accounts, require parental approval for 14 and 15 year old users, and give parents a clear process to request that a minor's account be terminated. As of this year, the bill had passed a House Committee of the Whole vote and was under consideration with a Senate strike everything amendment. I support the core protections in this kind of legislation, including account termination rights for parents and permanent deletion of a minor's personal data upon termination. As a licensed mental health counselor, I am concerned about the documented relationship between heavy social media use and youth mental health outcomes, and I support requiring platforms to disclose algorithmic design features, such as infinite scrolling and autoplay video, that are associated with compulsive use among minors. I also support Arizona's existing age verification requirements for websites where a substantial portion of content is sexual material harmful to minors, while ensuring that any verification method used does not require platforms to retain or transmit a minor's identifying information to government agencies, which protects both child safety and family privacy. Any legislation I support must be paired with independent research on effectiveness and unintended consequences before permanent adoption.


